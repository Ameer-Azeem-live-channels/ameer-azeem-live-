<!DOCTYPE html> <html lang="ta"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Ameer Azeem Global Media - Live TV</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
    :root { --primary-red: #ff0000; --bg-black: #020617; --card-bg: #0f172a; --accent-blue: #3b82f6; }
    body { background-color: var(--bg-black); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
    
    /* 📊 Top Stats Bar with Refresh Button */
    .stats-ticker { background: #000; padding: 10px; display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid var(--primary-red); position: sticky; top: 0; z-index: 1000; }
    .stat-item { font-size: 11px; font-weight: bold; color: #00ffcc; }
    .stat-item span { color: #fff; font-size: 16px; margin-left: 5px; }
    .refresh-btn { background: var(--primary-red); color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.3s; }
    .refresh-btn:hover { background: white; color: black; }

    header { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #111827, #000); border-bottom: 3px solid var(--primary-red); }
    .logo { height: 115px; cursor: pointer; transition: 0.3s; }
    .logo:hover { transform: scale(1.1); }
    .logo-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; background: var(--primary-red); border-radius: 50%; filter: blur(45px); opacity: 0.5; animation: fireEffect 1.5s infinite alternate; }
    @keyframes fireEffect { from { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 50px var(--primary-red); } }
    
    .nav-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 20px; background: #0a0f1e; scrollbar-width: none; }
    .lang-btn { text-align: center; cursor: pointer; opacity: 0.6; transition: 0.4s; min-width: 65px; }
    .lang-circle { width: 58px; height: 55px; border-radius: 50%; border: 2px solid #334155; background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .active-lang { opacity: 1; transform: scale(1.1); }
    .active-lang .lang-circle { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); }

    .section-header { background: linear-gradient(90deg, #000, var(--primary-red), #000); padding: 12px; text-align: center; font-weight: 900; font-size: 13px; margin: 15px 0; }
    #player-container { width: 95%; max-width: 900px; margin: 0 auto; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    iframe { width: 100%; height: 100%; border: none; }

    .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 25px 15px; max-width: 1000px; margin: 0 auto; }
    .channel-card { background: var(--card-bg); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
    .channel-card img { width: 55px; height: 55px; object-fit: contain; }
</style>
</head> <body>
<div class="stats-ticker"> <div class="stat-item">TOTAL INSTALLS: <span id="web-total-installs">0</span></div> <div class="stat-item">TODAY OPENS: <span id="web-today-opens">0</span></div> <button class="refresh-btn" onclick="location.reload()">REFRESH</button> </div>
<header> <div class="logo-container"> <div class="logo-glow"></div> <img src="https://raw.githubusercontent.com/Ameer-Azeem-live-channels/ameer-azeem-live-/main/logo.png.png" class="logo" onclick="smartDownload()"> </div> </header>
<div class="nav-scroll" id="lang-nav"></div> <div class="section-header" id="section-title">TAMIL LIVE NEWS</div>
<div id="player-container"> <iframe id="main-player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe> </div>
<div class="channel-grid" id="channel-list"></div>
<script> // 🚀 Firebase Setup const firebaseConfig = { databaseURL: "https://ameer-azeem-live-channel-default-rtdb.asia-southeast1.firebasedatabase.app" }; firebase.initializeApp(firebaseConfig); const db = firebase.database();
// 📊 Real-time Count Update
db.ref("growth/total_installs").on("value", s => document.getElementById("web-total-installs").innerText = s.val() || 0);
const todayStr = new Date().toISOString().substring(0, 10);
db.ref(`growth/daily/${todayStr}/opens`).on("value", s => document.getElementById("web-today-opens").innerText = s.val() || 0);

const GIST_URL = "https://gist.githubusercontent.com/Ameer-Azeem-live-channels/41a0c696f5fb2cb0385390afab22dc7b/raw/channels.json";
const IMG_BASE = "https://raw.githubusercontent.com/Ameer-Azeem-live-channels/ameer-azeem-live-/main/assets/images/";

const mapping = {
    "TAMIL": ["sun-news.png.png", "polimer-news.png.png", "news-thanthi.png.png", "news-seven.png.png", "tamil-news.png.png"],
    "ENGLISH": ["repulics-english.png.png", "Time-now-english.png.png", "al-Jazeera-english.png.png", "cnn-english.png.png"],
    "TELUGU": ["tv9-telugu-news.png.png", "ntv-telugu-news.png.png", "z-news-telugu.png.png"],
    "KANNADA": ["news18-kanada.png.png", "news1st-kanada.png.png", "tv9-kanada-news.png.png"]
};

let allData = {};

async function init() {
    try {
        loadNav();
        const res = await fetch(GIST_URL + "?t=" + Date.now());
        allData = await res.json();
        changeLanguage("TAMIL");
    } catch(e) { console.error("Error loading data"); }
}

function loadNav() {
    const nav = document.getElementById('lang-nav');
    Object.keys(mapping).forEach(cat => {
        const div = document.createElement('div');
        div.className = 'lang-btn' + (cat === "TAMIL" ? " active-lang" : "");
        div.id = `btn-${cat}`;
        div.onclick = () => changeLanguage(cat);
        div.innerHTML = `<div class="lang-circle">${cat.charAt(0)}</div><div style="font-size:9px;font-weight:bold">${cat}</div>`;
        nav.appendChild(div);
    });
}

function changeLanguage(lang) {
    document.getElementById('section-title').innerText = lang + " LIVE NEWS";
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
    document.getElementById(`btn-${lang}`).classList.add('active-lang');
    const grid = document.getElementById('channel-list'); grid.innerHTML = "";
    mapping[lang].forEach(ch => {
        const card = document.createElement('div'); card.className = 'channel-card';
        card.onclick = () => {
            const vid = allData[ch];
            if(vid) document.getElementById('main-player').src = `https://www.youtube.com/embed/${vid}?autoplay=1`;
        };
        let folder = (lang == "KANNADA" ? "kanada" : lang.toLowerCase()) + "channels/";
        card.innerHTML = `<img src="${(IMG_BASE+folder+ch).replace(/ /g,"%20")}" onerror="this.src='logo.png.png'">`;
        grid.appendChild(card);
    });
}

function smartDownload() { window.location.href = "https://github.com/Ameer-Azeem-live-channels/ameer-azeem-live-/releases/download/v1a/app-release.apk"; }
init();
</script> </body> </html>
