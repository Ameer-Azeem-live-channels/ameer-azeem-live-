<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameer Azeem Global Media - Live TV</title>
    
    <!-- Firebase SDK (Growth விபரங்களை எடுக்க) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary-red: #ff0000; --bg-black: #020617; --card-bg: #0f172a; --accent-blue: #3b82f6; }
        body { background-color: var(--bg-black); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* 📊 புதிய Growth Monitor Style */
        .stats-bar { background: #000; padding: 10px; display: flex; justify-content: space-around; border-bottom: 1px solid #333; font-size: 11px; font-weight: bold; color: #00ffcc; }
        .stat-box { text-align: center; }
        .stat-val { display: block; font-size: 18px; color: #fff; }

        header { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #111827, #000); border-bottom: 3px solid var(--primary-red); }
        .logo { height: 115px; cursor: pointer; transition: 0.3s; }
        .logo:hover { transform: scale(1.1); }
        
        .nav-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 20px; background: #0a0f1e; scrollbar-width: none; }
        .lang-btn { text-align: center; cursor: pointer; opacity: 0.6; transition: 0.4s; min-width: 65px; }
        .active-lang { opacity: 1; transform: scale(1.1); }
        .lang-circle { width: 58px; height: 55px; border-radius: 50%; border: 2px solid #334155; background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        
        .section-header { background: linear-gradient(90deg, #000, var(--primary-red), #000); padding: 12px; text-align: center; font-weight: 900; font-size: 13px; margin: 15px 0; }
        #player-container { width: 95%; max-width: 900px; margin: 0 auto; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        iframe { width: 100%; height: 100%; border: none; }
        
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 25px 15px; max-width: 1000px; margin: 0 auto; }
        .channel-card { background: var(--card-bg); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .channel-card img { width: 55px; height: 55px; object-fit: contain; }
        .hub-btn { padding: 12px 20px; border-radius: 35px; color: white; text-decoration: none; font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 8px; margin: 6px; }
        .wa-btn { background: #25d366; } .tg-btn { background: #0088cc; }
    </style>
</head>
<body>

<!-- 📊 Live Growth Tracker - உங்கள் வெப்சைட்டின் உச்சியில் இது இருக்கும் -->
<div class="stats-bar">
    <div class="stat-box">மொத்த டவுன்லோட் <span id="stat-total" class="stat-val">0</span></div>
    <div class="stat-box">இன்றைய ஓப்பனிங் <span id="stat-today" class="stat-val">0</span></div>
    <div class="stat-box">முக்கிய நாடு <span id="stat-country" class="stat-val">-</span></div>
</div>

<header>
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/Ameer-Azeem-live-channels/ameer-azeem-live-/main/logo.png.png" class="logo" onclick="smartDownload()">
    </div>
</header>

<div class="nav-scroll" id="lang-nav"></div>
<div class="section-header" id="section-title">TAMIL LIVE NEWS</div>
<div id="player-container">
    <iframe id="main-player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>
<div class="channel-grid" id="channel-list"></div>

<!-- ... உங்கள் பழைய ஷேர் பட்டன்கள் மற்றும் ஃபீட்பேக் செக்ஷன் இங்கே இருக்கும் ... -->

<script>
    // 1. Firebase Config - உங்கள் படத்திலிருந்து எடுக்கப்பட்டது
    const firebaseConfig = {
        databaseURL: "https://ameer-azeem-live-channel-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Live Stats Listener - இது தானாகவே எண்களை மாற்றும்
    db.ref("growth/total_installs").on("value", s => document.getElementById("stat-total").innerText = s.val() || 0);
    const today = new Date().toISOString().substring(0, 10);
    db.ref(`growth/daily/${today}/opens`).on("value", s => document.getElementById("stat-today").innerText = s.val() || 0);
    
    // 3. Channel Data (Gist)
    const GIST_URL = "https://gist.githubusercontent.com/Ameer-Azeem-live-channels/41a0c696f5fb2cb0385390afab22dc7b/raw/channels.json";
    const IMG_BASE = "https://raw.githubusercontent.com/Ameer-Azeem-live-channels/ameer-azeem-live-/main/assets/images/";

    const mapping = {
        "TAMIL": ["sun-news.png.png", "polimer-news.png.png", "news-thanthi.png.png", "news-seven.png.png", "tamil-news.png.png"],
        "ENGLISH": ["repulics-english.png.png", "Time-now-english.png.png", "al-Jazeera-english.png.png", "cnn-english.png.png"],
        "TELUGU": ["tv9-telugu-news.png", "ntv-telugu-news.png", "z-news-telugu.png", "abn-telugu-news.png"],
        "KANNADA": ["news18-kanada.png.png", "news1st-kanada.png.png", "tv9-kanada-news.png.png"],
        "ARABIC": ["sky-news.png.png", "al-arabiya-news.png.png", "aljazeera-news.png.png"]
    };

    let allData = {};

    async function init() {
        const res = await fetch(GIST_URL + "?t=" + Date.now());
        allData = await res.json();
        loadNav();
        changeLanguage("TAMIL");
    }

    function loadNav() {
        const nav = document.getElementById('lang-nav');
        Object.keys(mapping).forEach(cat => {
            const div = document.createElement('div');
            div.className = 'lang-btn';
            div.id = `btn-${cat}`;
            div.onclick = () => changeLanguage(cat);
            div.innerHTML = `<div class="lang-circle">${cat.charAt(0)}</div><div style="font-size:10px">${cat}</div>`;
            nav.appendChild(div);
        });
    }

    function changeLanguage(lang) {
        document.getElementById('section-title').innerText = lang + " LIVE NEWS";
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
        document.getElementById(`btn-${lang}`).classList.add('active-lang');

        const grid = document.getElementById('channel-list');
        grid.innerHTML = "";
        
        mapping[lang].forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.onclick = () => {
                const vid = allData[ch];
                if(vid && vid.length > 5) {
                    document.getElementById('main-player').src = `https://www.youtube.com/embed/${vid}?autoplay=1`;
                } else {
                    alert("இந்த சேனல் தற்போது ஆஃப்லைனில் உள்ளது. அட்மின் பேனலில் Bot ரன் செய்யவும்.");
                }
            };
            let folder = (lang == "KANNADA" ? "kanada" : lang.toLowerCase()) + "channels/";
            card.innerHTML = `<img src="${IMG_BASE + folder + ch}" onerror="this.src='logo.png.png'">`;
            grid.appendChild(card);
        });
    }

    function smartDownload() { window.location.href = "https://github.com/Ameer-Azeem-live-channels/ameer-azeem-live-/releases/download/v1a/app-release.apk"; }
    init();
</script>
</body>
</html>
